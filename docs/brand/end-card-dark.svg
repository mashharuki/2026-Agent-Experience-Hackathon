<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <title>Photo Prep: end card dark</title>
<defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="0.55" stop-color="#0e2a4d"/>
      <stop offset="1" stop-color="#123761"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fbcf5" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7fbcf5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#g)"/>
  <circle cx="1500" cy="300" r="620" fill="url(#glow)"/>
  <circle cx="260" cy="900" r="520" fill="url(#glow)"/>
  <!-- brow-like arcs, echoing the logo -->
  <g fill="none" stroke="#7fbcf5" stroke-linecap="round">
    <path d="M1020 700C1250 470 1560 420 1860 520" stroke-width="3" opacity="0.28"/>
    <path d="M1000 760C1240 520 1570 470 1900 580" stroke-width="3" opacity="0.2"/>
    <path d="M980 820C1230 570 1580 520 1920 640" stroke-width="3" opacity="0.14"/>
    <path d="M60 330C260 200 520 170 760 240" stroke-width="3" opacity="0.2"/>
    <path d="M40 390C250 260 530 230 790 300" stroke-width="3" opacity="0.13"/>
  </g>
  <!-- viewfinder corners -->
  <g fill="none" stroke="#7fbcf5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
    <path d="M80 190v-70a40 40 0 0 1 40-40h70"/>
    <path d="M1730 80h70a40 40 0 0 1 40 40v70"/>
    <path d="M1840 890v70a40 40 0 0 1-40 40h-70"/>
    <path d="M190 1000h-70a40 40 0 0 1-40-40v-70"/>
  </g>
  <circle cx="1612" cy="410" r="12" fill="#ffd54f"/>
<g transform="translate(832 200) scale(0.5)"><defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1259a8"/>
      <stop offset="1" stop-color="#4aa8f2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- viewfinder corners: the photo to come -->
  <g fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M104 176v-52a20 20 0 0 1 20-20h52"/>
    <path d="M336 104h52a20 20 0 0 1 20 20v52"/>
    <path d="M408 336v52a20 20 0 0 1-20 20h-52"/>
    <path d="M176 408h-52a20 20 0 0 1-20-20v-52"/>
  </g>
  <!-- one brow, tapered: the single thing to tidy -->
  <path fill="#fff" d="M152 300C186 238 270 206 360 238c8 3 8 14-1 14-68-12-128 8-176 62-12 13-38-1-31-14z"/>
  <!-- one small touch -->
  <circle cx="372" cy="186" r="22" fill="#ffd54f"/></g>
<text x="960" y="590" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',system-ui,sans-serif" font-size="104" font-weight="800" fill="#eaf4ff" letter-spacing="-2">Do less. Let people choose.</text>
<text x="960" y="680" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',system-ui,sans-serif" font-size="44" font-weight="500" fill="#7fbcf5">A little prep before the photo (撮る前のひと手間)</text>
<text x="960" y="790" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',system-ui,sans-serif" font-size="36" fill="#9cc4ee">github.com/mashharuki/2026-Agent-Experience-Hackathon</text>
<text x="960" y="850" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',system-ui,sans-serif" font-size="30" fill="#9cc4ee">MIT license</text>
</svg>
