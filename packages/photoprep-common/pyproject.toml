[project]
name = "photoprep-common"
version = "0.1.0"
description = "Code shared by the API and the worker: the DynamoDB store port and the session state rules"
requires-python = ">=3.12,<3.13"
dependencies = ["boto3>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photoprep_common"]
