openapi: 3.0.3
info:
  title: Pre-Photo Grooming Assist API (draft)
  version: 0.0.1-draft
  description: |
    草案。正本は tasks で作成する packages/api-spec/openapi.yaml。
    OpenAPI 3.0.3 の構文のみ使う（3.1 専用構文を混在させない）。
    最小境界は docs/architecture/README.md の6操作。同意は POST /sessions に含める。
servers:
  - url: /
security:
  - cognitoAccessToken: [photoprep/session]
paths:
  /sessions:
    post:
      operationId: createSession
      summary: 同意を記録してセッションを作成する
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: 作成済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /sessions/{sessionId}:
    delete:
      operationId: endSession
      summary: セッションを終了し、新規解析の拒否と画像削除を開始する
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "202":
          description: 終了を受け付けた（署名URLの失効や画像の物理削除の完了は即時には保証しない）
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /sessions/{sessionId}/uploads:
    post:
      operationId: createUpload
      summary: 一時画像の署名付きアップロード枠を作成する
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: アップロード枠（サーバーが決めたキー、有効期限60秒）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /sessions/{sessionId}/analyses:
    post:
      operationId: requestAnalysis
      summary: 解析ジョブを受け付ける（非同期）
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestAnalysisRequest"
      responses:
        "202":
          description: 受付済み。結果は GET /jobs/{jobId} で取得する
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /sessions/{sessionId}/feedback:
    post:
      operationId: recordFeedback
      summary: 助言への反応と前後比較の選択を記録する
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
      responses:
        "204":
          description: 記録済み
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /jobs/{jobId}:
    get:
      operationId: getJob
      summary: ジョブの状態と結果を取得する
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, minLength: 8, maxLength: 64 }
      responses:
        "200":
          description: ジョブ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    cognitoAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito のアクセストークン。IDトークンは使わない。
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, minLength: 8, maxLength: 64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 64 }
  responses:
    Error:
      description: エラー（本文に画像・自由記述を含めない）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Scope:
      type: string
      enum: [brow, bangs, look_first]
    Restriction:
      type: string
      enum: [no_touch_brow, keep_brow_shape, no_touch_bangs]
    AdviceKind:
      type: string
      description: docs/mvp.md と contracts/decider-decision.md の識別子。名称を変えない。
      enum: [grooming_tip, capture_setup_tip, clarify, offer_finish]
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [consentVersion, scope]
      properties:
        consentVersion: { type: string, maxLength: 32 }
        scope: { $ref: "#/components/schemas/Scope" }
        wish: { type: string, maxLength: 200 }
        restrictions:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/Restriction" }
    Session:
      type: object
      additionalProperties: false
      required: [sessionId, state, changesUsed, analysesUsed, expiresAt]
      properties:
        sessionId: { type: string }
        state:
          type: string
          enum: [CONSULTING, ANALYZING, ADVICE_SHOWN, CAPTURE_ADJUST, TRYING, COMPARING, DONE]
        changesUsed: { type: integer, minimum: 0, maximum: 2 }
        analysesUsed: { type: integer, minimum: 0, maximum: 3 }
        expiresAt: { type: string, format: date-time }
    CreateUploadRequest:
      type: object
      additionalProperties: false
      required: [phase, contentType, sizeBytes]
      properties:
        phase: { type: string, enum: [before, after] }
        contentType: { type: string, enum: [image/jpeg, image/png] }
        sizeBytes: { type: integer, minimum: 1, maximum: 2097152 }
    Upload:
      type: object
      additionalProperties: false
      required: [uploadId, url, fields, expiresAt]
      properties:
        uploadId: { type: string }
        url: { type: string, format: uri }
        fields:
          type: object
          additionalProperties: { type: string }
        expiresAt: { type: string, format: date-time }
    RequestAnalysisRequest:
      type: object
      additionalProperties: false
      required: [uploadId, phase]
      properties:
        uploadId: { type: string }
        phase: { type: string, enum: [before, after] }
        tools:
          type: array
          maxItems: 5
          items: { type: string, maxLength: 40 }
        timeBudget: { type: string, enum: [short, normal] }
    JobAccepted:
      type: object
      additionalProperties: false
      required: [jobId, status]
      properties:
        jobId: { type: string }
        status: { type: string, enum: [QUEUED] }
    Job:
      type: object
      additionalProperties: false
      required: [jobId, status]
      properties:
        jobId: { type: string }
        status:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, UNKNOWN, CANCELLED]
        advice: { $ref: "#/components/schemas/Advice" }
        errorClass:
          type: string
          enum: [no_image, unreadable_image, quota_exceeded, worker_unavailable, model_error, cancelled]
    Advice:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/AdviceKind" }
        text: { type: string, maxLength: 400 }
        basis: { type: string, enum: [observation, user_request] }
        comparable: { type: boolean, description: after撮影の場合、前後が比較可能か }
    FeedbackRequest:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [advice_response, comparison] }
        adviceResponse: { type: string, enum: [try, another, finish] }
        comparisonChoice: { type: string, enum: [prefer_before, prefer_after, unclear] }
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
